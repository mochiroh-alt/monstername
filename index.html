<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDFランダムビューア</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000; /* 背景を黒にして画像を引き立てる（白でも可） */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
        }
        .image-box {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img {
            max-width: 100%;
            max-height: 100vh;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body onclick="showRandomImage()">

    <div class="image-box">
        <img id="viewer" src="" alt="画像">
    </div>

<script>
    const totalPages = 240; 

    function showRandomImage(event) {
        // リンクなどがもし将来追加されても誤作動しないための記述
        if (totalPages <= 0) return;
        
        const randomPage = Math.floor(Math.random() * totalPages) + 1;
        const formattedPage = String(randomPage).padStart(3, '0');
        const imagePath = `page_${formattedPage}.png`;
        
        document.getElementById('viewer').src = imagePath;
    }

    // ページを開いたときにも自動で1枚表示する
    window.onload = function() {
        showRandomImage();
    };
</script>

</body>
</html>
